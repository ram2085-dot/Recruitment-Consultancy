<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Abstract illustration of a cable cross-section, concentric conductor and insulation layers">
	<title>Cable cross-section</title>
	<defs>
		<linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#150e1f" />
			<stop offset="55%" stop-color="#3d2a5c" />
			<stop offset="100%" stop-color="#52396f" />
		</linearGradient>
		<radialGradient id="coreGrad3" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#f8b000" />
			<stop offset="60%" stop-color="#e03018" />
			<stop offset="100%" stop-color="#781828" />
		</radialGradient>
		<radialGradient id="glow3" cx="76%" cy="46%" r="55%">
			<stop offset="0%" stop-color="#f8b000" stop-opacity="0.2" />
			<stop offset="100%" stop-color="#f8b000" stop-opacity="0" />
		</radialGradient>
	</defs>

	<rect width="1600" height="900" fill="url(#bgGrad3)" />
	<rect width="1600" height="900" fill="url(#glow3)" />

	<!-- Concentric cable layers, cropped by the right/bottom edge. Scaled up ~1.7x from the
	     first pass (2026-08-15) — too small against the 1600x900 canvas, it read as a
	     lonely target/bullseye and would have nearly vanished under the hero's blur filter. -->
	<g transform="translate(1260 460) scale(1.7)">
		<circle r="330" fill="none" stroke="#f2ede4" stroke-opacity="0.1" stroke-width="2" />
		<circle r="270" fill="none" stroke="#f2ede4" stroke-opacity="0.16" stroke-width="10" />
		<circle r="200" fill="none" stroke="#f2ede4" stroke-opacity="0.22" stroke-width="14" />
		<circle r="130" fill="none" stroke="url(#coreGrad3)" stroke-width="16" opacity="0.9" />
		<circle r="70" fill="url(#coreGrad3)" opacity="0.95" />

		<!-- Radiating conductor strand lines within the core -->
		<g stroke="#150e1f" stroke-opacity="0.35" stroke-width="3">
			<line x1="-40" y1="-40" x2="40" y2="40" />
			<line x1="40" y1="-40" x2="-40" y2="40" />
			<line x1="0" y1="-55" x2="0" y2="55" />
			<line x1="-55" y1="0" x2="55" y2="0" />
		</g>
	</g>

	<!-- Smaller echo cross-section, upper-left, very faint -->
	<g transform="translate(230 190)" opacity="0.12">
		<circle r="120" fill="none" stroke="#f2ede4" stroke-width="6" />
		<circle r="60" fill="none" stroke="#f2ede4" stroke-width="10" />
	</g>

	<!-- Rivet-like accent dots -->
	<g fill="#f8b000" opacity="0.45">
		<circle cx="1520" cy="260" r="4" />
		<circle cx="1470" cy="700" r="4" />
	</g>
</svg>
