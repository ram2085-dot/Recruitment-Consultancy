<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Abstract blueprint-style illustration of a transformer circuit schematic on a technical grid">
	<title>Circuit blueprint</title>
	<defs>
		<linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#150e1f" />
			<stop offset="55%" stop-color="#3d2a5c" />
			<stop offset="100%" stop-color="#52396f" />
		</linearGradient>
		<linearGradient id="lineGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#781828" />
			<stop offset="45%" stop-color="#e03018" />
			<stop offset="100%" stop-color="#f8b000" />
		</linearGradient>
		<radialGradient id="glow4" cx="68%" cy="42%" r="60%">
			<stop offset="0%" stop-color="#f8b000" stop-opacity="0.18" />
			<stop offset="100%" stop-color="#f8b000" stop-opacity="0" />
		</radialGradient>
		<pattern id="grid4" width="64" height="64" patternUnits="userSpaceOnUse">
			<path d="M 64 0 L 0 0 0 64" fill="none" stroke="#f2ede4" stroke-opacity="0.06" stroke-width="1" />
		</pattern>
	</defs>

	<rect width="1600" height="900" fill="url(#bgGrad4)" />
	<rect width="1600" height="900" fill="url(#grid4)" />
	<rect width="1600" height="900" fill="url(#glow4)" />

	<!-- Transformer schematic symbol: two facing coil windings either side of a core line.
	     Scaled up ~1.9x from the first pass (2026-08-15) — at the original size the fine
	     linework read as a small isolated diagram lost in the canvas, and would have nearly
	     disappeared once the hero's blur filter hit it. -->
	<g transform="translate(1150 450) scale(1.9)" fill="none" stroke="url(#lineGrad4)" stroke-width="6" stroke-linecap="round">
		<path d="M -120 -180 a 30 30 0 0 1 0 60" />
		<path d="M -120 -120 a 30 30 0 0 1 0 60" />
		<path d="M -120 -60 a 30 30 0 0 1 0 60" />
		<path d="M -120 0 a 30 30 0 0 1 0 60" />
		<path d="M -120 60 a 30 30 0 0 1 0 60" />
		<path d="M -120 120 a 30 30 0 0 1 0 60" />

		<path d="M 120 -180 a 30 30 0 0 0 0 60" />
		<path d="M 120 -120 a 30 30 0 0 0 0 60" />
		<path d="M 120 -60 a 30 30 0 0 0 0 60" />
		<path d="M 120 0 a 30 30 0 0 0 0 60" />
		<path d="M 120 60 a 30 30 0 0 0 0 60" />
		<path d="M 120 120 a 30 30 0 0 0 0 60" />

		<line x1="-10" y1="-200" x2="-10" y2="200" stroke="#f2ede4" stroke-opacity="0.5" stroke-width="4" />
		<line x1="10" y1="-200" x2="10" y2="200" stroke="#f2ede4" stroke-opacity="0.5" stroke-width="4" />

		<!-- Lead lines running off-canvas -->
		<line x1="-120" y1="-180" x2="-260" y2="-180" stroke-opacity="0.6" />
		<line x1="-120" y1="180" x2="-260" y2="180" stroke-opacity="0.6" />
		<line x1="120" y1="-180" x2="300" y2="-180" stroke-opacity="0.6" />
		<line x1="120" y1="180" x2="300" y2="180" stroke-opacity="0.6" />
	</g>

	<!-- Faint dimension/leader lines, blueprint style -->
	<g stroke="#f2ede4" stroke-opacity="0.14" stroke-width="2">
		<line x1="120" y1="140" x2="480" y2="140" />
		<line x1="120" y1="120" x2="120" y2="160" />
		<line x1="480" y1="120" x2="480" y2="160" />
		<line x1="160" y1="760" x2="560" y2="760" />
	</g>

	<circle cx="1150" cy="450" r="2" fill="#f8b000" opacity="0.6" />
</svg>
